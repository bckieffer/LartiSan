[package]
name = "lartisan-scsi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SCSI transports (macOS IOKit, Linux SG_IO, Windows pass-through), safety guard and burn executor"
build = "build.rs"

[dependencies]
lartisan-core = { path = "../lartisan-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Storage_IscsiDisc", "Win32_Security"] }

[build-dependencies]
cc = "1"
